name: CI-BASE

on:
  workflow_call:
    inputs:
      WF_NODE_VERSION:
        type: string
        required: true
      WF_ENV_TYPE_DEPLOY:
        type: string
        required: true
      WF_PUBLISH_CODE_COVERAGE:
        type: string
        default: false
        required: false
      WF_BACKSTAGE_URL:
        type: string
        required: false
      WF_CREATE_DOTENV_BEFORE_BUILD:
        type: boolean
        default: false
        required: false
      WF_ENV_TYPE:
        type: string
        required: false
      WF_DOCKER_LAYER_CACHE:
        description: >
          Build the image with Buildx and keep its layers in the GitHub Actions
          cache. Only pays off when the Dockerfile copies the dependency manifests
          and installs before it copies the source: with `COPY .` first, every
          commit changes the first layer and nothing is reused, while each build
          still pays for exporting the layers to the cache.
        type: boolean
        default: false
        required: false

    secrets:
      WF_NPM_TOKEN:
        required: true
      WF_NPM_USER:
        required: true
      WF_GITHUB_TOKEN:
        required: true
      WF_REGISTRY:
        required: true
      WF_FONT_AWESOME_TOKEN:
        required: false
      WF_AWS_ACCESS_KEY_ID:
        required: false
      WF_AWS_SECRET_ACCESS_KEY:
        required: false
      WF_AWS_REGION:
        required: false

    outputs:
      servicename:
        description: "The service name"
        value: ${{ jobs.declaration.outputs.servicename }}
      has_workers:
        description: "true when the service declares workers in .quero/workers/"
        value: ${{ jobs.declaration.outputs.has_workers }}
      workers:
        description: "JSON array with the declared worker names"
        value: ${{ jobs.declaration.outputs.workers }}

# Um run por PR: um push novo cancela o build anterior do mesmo PR. Fora de PR
# o grupo e o run_id, entao push em stage/main segue sem cancelar nada (cancelar
# no meio do semantic-release deixaria tag sem commit de release).
# O nome do workflow entra no grupo porque, em workflow chamado, github.* e o
# contexto do chamador: sem ele, os workflows do mesmo run se cancelariam.
concurrency:
  group: base_node_build-${{ github.repository }}-${{ inputs.WF_ENV_TYPE_DEPLOY }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Lint, testes e imagem eram passos de um job so, um depois do outro. Agora sao
# jobs: em PR os tres rodam ao mesmo tempo; fora de PR a imagem espera lint e
# testes, porque o release vem antes dela e nao pode sair de codigo que falhou.
# Os passos repetidos entre jobs sao ancoras YAML (&nome / *nome): edite o passo
# onde a ancora e definida e todos os jobs que a usam mudam juntos.
jobs:
  declaration:
    name: reading the declaration
    runs-on: ubuntu-latest
    outputs:
      servicename: ${{ steps.serviceName.outputs.servicename }}
      has_workers: ${{ steps.workers.outputs.has_workers }}
      workers: ${{ steps.workers.outputs.workers }}
      workers_entrypoint: ${{ steps.workers.outputs.entrypoint }}
    steps:
      - &checkout
        name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      # Roda antes do release (build-release depende deste job): uma declaracao
      # quebrada falha o run antes de uma versao ser publicada. A validacao
      # autoritativa depende da imagem e fica em validate-workers.
      - name: Validating workers declaration
        id: workers
        run: |
          set -euo pipefail
          shopt -s nullglob

          if [ ! -d .quero/workers ]; then
            {
              echo "has_workers=false"
              echo "workers=[]"
            } >> "$GITHUB_OUTPUT"
            echo "Sem .quero/workers/: nada a validar."
            exit 0
          fi

          files=(.quero/workers/*.yaml)

          # Pasta sem .yaml e quase sempre extensao errada: seguir em silencio
          # faria o worker nunca ser deployado, sem nada no log.
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::.quero/workers/ existe mas nao declara nenhum worker"
            exit 1
          fi

          failed=0
          names=()
          entrypoints=()

          fail() {
            echo "::error file=$1::$2"
            failed=1
          }

          for file in "${files[@]}"; do
            expected="$(basename "$file" .yaml)"

            IFS='|' read -r name description owner entrypoint <<< "$(
              yq e '[.name // "", .description // "", .owner // "", .entrypoint // ""] | join("|")' "$file"
            )"

            if [ "$name" != "$expected" ]; then
              fail "$file" "name deve ser \"$expected\", veio \"$name\""
            fi

            for required in description owner entrypoint; do
              if [ -z "${!required}" ]; then
                fail "$file" "campo obrigatorio ausente: $required"
              fi
            done

            if [ ! -f "src/workers/$name.worker.ts" ] && [ ! -f "src/workers/$name.worker.js" ]; then
              fail "$file" "sem implementacao: src/workers/$name.worker.ts nao existe"
            fi

            names+=("$name")
            entrypoints+=("$entrypoint")
          done

          # Um entrypoint por servico: o deploy roda sempre o mesmo comando e
          # muda so o argv.
          if [ "$(printf '%s\n' "${entrypoints[@]}" | sort -u | wc -l)" -ne 1 ]; then
            echo "::error::workers declaram entrypoints diferentes: ${entrypoints[*]}"
            failed=1
          fi

          [ "$failed" = 0 ] || exit 1

          workers="$(printf '%s\n' "${names[@]}" | jq -Rsc 'split("\n") | map(select(. != "")) | sort')"

          {
            echo "has_workers=true"
            echo "workers=$workers"
            echo "entrypoint=${entrypoints[0]}"
          } >> "$GITHUB_OUTPUT"

          echo "Workers declarados: $workers"

      - &service_name
        name: Getting SERVICE_NAME
        id: serviceName
        run: |
          SERVICE_NAME=$(jq -r '.name' package.json)
          echo "servicename=$SERVICE_NAME" >> "$GITHUB_OUTPUT"

  lint:
    name: linting
    environment: ${{ inputs.WF_ENV_TYPE_DEPLOY }}
    env:
      FONT_AWESOME_TOKEN: ${{ secrets.WF_FONT_AWESOME_TOKEN }}
    runs-on: ubuntu-latest
    steps:
      - *checkout

      # Sem `cache: yarn`: a chave dele e o hash do yarn.lock, a mesma do cache
      # de node_modules abaixo. Quando o lockfile nao muda, node_modules vem do
      # cache e o yarn nem roda; quando muda, os dois caches erram juntos. O
      # cache do yarn so custava o tempo de restaurar e salvar.
      - &setup_node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.WF_NODE_VERSION }}
          registry-url: ${{ secrets.WF_REGISTRY }}

      # Em lockfile novo, lint e test instalam em paralelo e os dois tentam
      # salvar a mesma chave: um salva, o outro so registra um aviso.
      - &node_modules_cache
        name: Cache NPM dependencies
        id: node-modules-cache
        uses: actions/cache@v4
        env:
          cache-name: node-modules-cache
        with:
          path: node_modules
          key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-build-${{ env.cache-name }}-
            ${{ runner.os }}-build-
            ${{ runner.os }}-

      - &npmrc
        name: Set up .npmrc
        run: |
          echo "@querodelivery:registry=https://npm.pkg.github.com" > .npmrc
          echo "//npm.pkg.github.com/:_authToken=${{ secrets.WF_NPM_TOKEN }}" >> .npmrc
          if [ -n "$FONT_AWESOME_TOKEN" ]; then
            echo "@fortawesome:registry=https://npm.fontawesome.com/" >> .npmrc
            echo "//npm.fontawesome.com/:_authToken=$FONT_AWESOME_TOKEN" >> .npmrc
          fi

      - &install
        name: install packages using yarn.lock
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.WF_NPM_TOKEN }}
        run: yarn --frozen-lockfile

      - name: linting
        run: yarn lint

      # yarn audit sai com um bitmask das severidades (info 1, low 2, moderate 4,
      # high 8, critical 16) que o --level nao filtra, e erro de rede tambem sai
      # com 1. Por isso a decisao vem do auditSummary do --json: sem ele o audit
      # nao rodou, e o step falha em vez de deixar passar.
      # --registry fixo: o registry-url do setup-node pode nao ter endpoint de audit.
      # Bloqueia em PR; em push so avisa, para uma advisory publicada depois do
      # merge nao travar o deploy de codigo ja revisado.
      - name: security audit (high and critical)
        env:
          NODE_AUTH_TOKEN: ${{ secrets.WF_NPM_TOKEN }}
          LEVEL: ${{ github.event_name == 'push' && 'warning' || 'error' }}
        run: |
          set -euo pipefail
          report="$(mktemp)"

          yarn audit --json --registry https://registry.npmjs.org/ > "$report" || true

          summary="$(jq -cR 'fromjson? | select(.type == "auditSummary") | .data.vulnerabilities' "$report")"
          if [ -z "$summary" ]; then
            echo "::error::yarn audit nao retornou resultado (erro ao consultar o registry?). Saida:"
            cat "$report"
            exit 1
          fi
          echo "yarn audit: $summary"

          # Uma linha por advisory: o --json repete a advisory para cada caminho de dependencia.
          jq -rR 'fromjson? | select(.type == "auditAdvisory") | .data.advisory
            | select(.severity == "high" or .severity == "critical")
            | "\(.severity) \(.module_name) \(.vulnerable_versions) (corrigido em \(.patched_versions)): \(.title) \(.url)"' \
            "$report" | sort -u

          found="$(jq -r '.high + .critical' <<< "$summary")"
          if [ "$found" -eq 0 ]; then
            exit 0
          fi

          echo "::$LEVEL::yarn audit encontrou $found ocorrencia(s) high/critical (lista acima). Atualize as dependencias antes do merge."
          [ "$LEVEL" = warning ] || exit 1

  test:
    name: testing
    environment: ${{ inputs.WF_ENV_TYPE_DEPLOY }}
    env:
      FONT_AWESOME_TOKEN: ${{ secrets.WF_FONT_AWESOME_TOKEN }}
    runs-on: ubuntu-latest
    steps:
      - *checkout
      - *setup_node
      - *node_modules_cache
      - *npmrc
      - *install

      - name: testing
        env:
          RUN_PUBLISH_COVERAGE: ${{ inputs.WF_PUBLISH_CODE_COVERAGE }}
          BACKSTAGE_URL: ${{ inputs.WF_BACKSTAGE_URL }}
        run: |
          yarn test:ci
          COMPONENT_NAME=$(node -p -e "require('./package.json').name")
          FILE=coverage/int/cobertura-coverage.xml
          if $RUN_PUBLISH_COVERAGE; then
            if [ -f "$FILE" ]; then
              curl --request POST \
                --url "$BACKSTAGE_URL/api/code-coverage/report?entity=component%3Adefault%2F$COMPONENT_NAME&coverageType=cobertura" \
                --header 'Content-Type: text/xml' \
                --data @$FILE
              echo "Sending coverage report to quero developer portal"
            else
              echo "::warning:: $FILE does not exist, code coverage not sent"
            fi
          fi

  # Em PR o semantic-release nao publica nada, entao a imagem nao precisa
  # esperar lint e testes. O deploy do PR continua esperando: o job chamador so
  # termina quando todos os jobs daqui terminam, e so segue se todos passaram.
  build-pr:
    name: building the image
    if: github.event_name == 'pull_request'
    environment: ${{ inputs.WF_ENV_TYPE_DEPLOY }}
    env:
      FONT_AWESOME_TOKEN: ${{ secrets.WF_FONT_AWESOME_TOKEN }}
    runs-on: ubuntu-latest
    steps:
      - *checkout
      - *npmrc
      - *service_name

      - &dotenv
        name: Creating dotenv from aws parameter store
        uses: almerindo/action-env-from-aws-ssm@main
        if: ${{ inputs.WF_CREATE_DOTENV_BEFORE_BUILD }}
        with:
          output: ./.env
          ssm-path: "/${{ inputs.WF_ENV_TYPE }}/${{ steps.serviceName.outputs.servicename }}"
          format: dotenv
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.WF_AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.WF_AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.WF_AWS_REGION }}

      # O .npmrc tambem vai como secret do BuildKit (id npmrc), para o Dockerfile
      # poder instalar com
      #   RUN --mount=type=secret,id=npmrc,target=<workdir>/.npmrc yarn install ...
      # em vez de copiar o arquivo: copiado, o token fica numa camada da imagem
      # publicada, mesmo que um RUN posterior apague o arquivo. Quem ainda usa
      # COPY continua funcionando, o .npmrc segue no workspace.
      - &docker_build
        name: Build Docker image
        if: ${{ !inputs.WF_DOCKER_LAYER_CACHE }}
        run: |
          docker build --secret id=npmrc,src=.npmrc -t ${{ steps.serviceName.outputs.servicename }}:ci-build .

      - &setup_buildx
        name: Set up Docker Buildx
        if: ${{ inputs.WF_DOCKER_LAYER_CACHE }}
        uses: docker/setup-buildx-action@v3

      # scope por servico: o cache do GitHub Actions e por repositorio, e um
      # monorepo com mais de uma imagem nao pode misturar as camadas.
      - &docker_build_cached
        name: Build Docker image (layer cache)
        if: ${{ inputs.WF_DOCKER_LAYER_CACHE }}
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          provenance: false
          tags: ${{ steps.serviceName.outputs.servicename }}:ci-build
          secret-files: |
            npmrc=./.npmrc
          cache-from: type=gha,scope=image-${{ steps.serviceName.outputs.servicename }}
          cache-to: type=gha,mode=max,scope=image-${{ steps.serviceName.outputs.servicename }}

      - &docker_save
        name: Save Docker image
        run: |
          docker save ${{ steps.serviceName.outputs.servicename }}:ci-build | gzip > image.tar.gz

      - &upload_image
        name: Upload Docker image as artifact
        uses: actions/upload-artifact@v4
        with:
          name: built-image
          path: image.tar.gz
          retention-days: 1

  # Fora de PR o release e a imagem ficam no mesmo job, nesta ordem: o
  # semantic-release grava a versao nova no workspace (package.json,
  # version.json) e a imagem tem que ser construida com ela.
  build-release:
    name: releasing and building the image
    if: github.event_name != 'pull_request'
    needs: [declaration, lint, test]
    environment: ${{ inputs.WF_ENV_TYPE_DEPLOY }}
    env:
      FONT_AWESOME_TOKEN: ${{ secrets.WF_FONT_AWESOME_TOKEN }}
    runs-on: ubuntu-latest
    steps:
      - *checkout
      - *setup_node
      - *node_modules_cache
      - *npmrc
      - *install

      - name: Release
        env:
          NPM_TOKEN: ${{ secrets.WF_NPM_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.WF_GITHUB_TOKEN }}
        run: yarn release

      - *service_name
      - *dotenv
      - *docker_build
      - *setup_buildx
      - *docker_build_cached
      - *docker_save
      - *upload_image

  # Pergunta a imagem que vai subir quais workers ela aceita, em vez de inferir
  # do fonte. Mesmo run, porque o artefato built-image e por run.
  validate-workers:
    name: validating workers against the built image
    needs: [declaration, build-pr, build-release]
    # Sem !cancelled() o job seria pulado sempre: um dos dois builds e pulado
    # em todo run, e um needs pulado pula quem depende dele.
    if: ${{ !cancelled() && needs.declaration.outputs.has_workers == 'true' && (needs.build-pr.result == 'success' || needs.build-release.result == 'success') }}
    runs-on: ubuntu-latest
    steps:
      - name: Download built image
        uses: actions/download-artifact@v4
        with:
          name: built-image

      - name: Load built image
        run: docker load --input image.tar.gz

      - name: Compare the image registry with the declaration
        env:
          IMAGE: ${{ needs.declaration.outputs.servicename }}:ci-build
          ENTRYPOINT: ${{ needs.declaration.outputs.workers_entrypoint }}
          DECLARED: ${{ needs.declaration.outputs.workers }}
        run: |
          set -euo pipefail

          # --entrypoint ignora o CMD da imagem; tail -1 descarta o que um
          # agente de instrumentacao escreva em stdout antes do JSON.
          output="$(docker run --rm --entrypoint node "$IMAGE" "$ENTRYPOINT" --list)"

          if ! actual="$(printf '%s' "$output" | tail -1 | jq -Sce 'sort')"; then
            echo "::error::--list nao retornou um array JSON. Saida completa:"
            printf '%s\n' "$output"
            exit 1
          fi

          expected="$(jq -Sc 'sort' <<< "$DECLARED")"

          echo "declarado em .quero/workers/: $expected"
          echo "aceito pela imagem:            $actual"

          if [ "$expected" != "$actual" ]; then
            echo "::error::declaracao e codigo divergem. Worker declarado sem implementacao sobe pod em CrashLoopBackOff; worker implementado sem declaracao nao e deployado."
            exit 1
          fi

  # Avisa em PR em vez de bloquear porque defs/main e alvo movel: o PR de um dev
  # nao pode ficar vermelho por mudanca pendente de outra pessoa.
  validate-workers-defs:
    name: validating workers against kube-apps-definitions
    needs: declaration
    if: needs.declaration.outputs.has_workers == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout definitions repo
        uses: actions/checkout@v4
        with:
          repository: QueroDelivery/kube-apps-definitions
          ref: main
          token: ${{ secrets.WF_GITHUB_TOKEN }}
          path: defs

      - name: Compare the declaration with the deployed folders
        env:
          SERVICE: ${{ needs.declaration.outputs.servicename }}
          DECLARED: ${{ needs.declaration.outputs.workers }}
          LEVEL: ${{ github.event_name == 'push' && 'error' || 'warning' }}
        run: |
          set -euo pipefail

          jq -r '.[]' <<< "$DECLARED" | sort > declared.txt

          find defs -maxdepth 1 -type d -name "$SERVICE-worker-*" -exec basename {} \; \
            | sed "s|^$SERVICE-worker-||" | sort > deployed.txt

          comm -23 declared.txt deployed.txt \
            | sed "s|.*|::$LEVEL::worker \"&\" declarado sem a pasta $SERVICE-worker-& em kube-apps-definitions. O deploy dele vai falhar.|"

          comm -13 declared.txt deployed.txt \
            | sed "s|.*|::$LEVEL::kube-apps-definitions tem $SERVICE-worker-&, que nao esta declarado em .quero/workers/. Esse pod sobe em CrashLoopBackOff.|"

          if cmp -s declared.txt deployed.txt; then
            echo "Declaracao e kube-apps-definitions estao de acordo."
          elif [ "$LEVEL" = error ]; then
            exit 1
          fi

  # Mantem o check "preparing" que este workflow sempre publicou, agora como o
  # resultado de todos os jobs: um repositorio que exige esse check na protecao
  # de branch continua barrado por lint, teste ou imagem que falhe.
  preparing:
    name: preparing
    needs:
      - declaration
      - lint
      - test
      - build-pr
      - build-release
      - validate-workers
      - validate-workers-defs
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Check the result of every job
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail

          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<< "$RESULTS"

          # skipped e esperado: so um dos dois builds roda por run, e os
          # validate-workers so rodam em servico com workers.
          if jq -e 'any(.[]; .result != "success" and .result != "skipped")' <<< "$RESULTS" > /dev/null; then
            echo "::error::um ou mais jobs falharam (lista acima)."
            exit 1
          fi

          if ! jq -e '."build-pr".result == "success" or ."build-release".result == "success"' <<< "$RESULTS" > /dev/null; then
            echo "::error::nenhum job construiu a imagem."
            exit 1
          fi
