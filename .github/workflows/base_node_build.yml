name: CI-BASE

on:
  workflow_call:
    inputs:
      WF_NODE_VERSION:
        type: string
        required: true
      WF_ENV_TYPE_DEPLOY:
        type: string
        required: true
      WF_PUBLISH_CODE_COVERAGE:
        type: string
        default: false
        required: false
      WF_BACKSTAGE_URL:
        type: string
        required: false
      WF_CREATE_DOTENV_BEFORE_BUILD:
        type: boolean
        default: false
        required: false
      WF_ENV_TYPE:
        type: string
        required: false

    secrets:
      WF_NPM_TOKEN:
        required: true
      WF_NPM_USER:
        required: true
      WF_GITHUB_TOKEN:
        required: true
      WF_REGISTRY:
        required: true
      WF_FONT_AWESOME_TOKEN:
        required: false
      WF_AWS_ACCESS_KEY_ID:
        required: false
      WF_AWS_SECRET_ACCESS_KEY:
        required: false
      WF_AWS_REGION:
        required: false

    outputs:
      servicename:
        description: "The service name"
        value: ${{ jobs.setup.outputs.output1 }}
      has_workers:
        description: "true when the service declares workers in .quero/workers/"
        value: ${{ jobs.setup.outputs.has_workers }}
      workers:
        description: "JSON array with the declared worker names"
        value: ${{ jobs.setup.outputs.workers }}

jobs:
  setup:
    environment: ${{ inputs.WF_ENV_TYPE_DEPLOY }}
    name: preparing
    env:
      FONT_AWESOME_TOKEN: ${{ secrets.WF_FONT_AWESOME_TOKEN }}
    runs-on: ubuntu-latest
    continue-on-error: false
    outputs:
      output1: ${{ steps.serviceName.outputs.servicename }}
      has_workers: ${{ steps.workers.outputs.has_workers }}
      workers: ${{ steps.workers.outputs.workers }}
      workers_entrypoint: ${{ steps.workers.outputs.entrypoint }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.WF_NODE_VERSION }}
          cache: "yarn"
          registry-url: ${{ secrets.WF_REGISTRY }}

      - name: Cache NPM dependencies
        id: node-modules-cache
        uses: actions/cache@v4
        env:
          cache-name: node-modules-cache
        with:
          path: node_modules
          key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-build-${{ env.cache-name }}-
            ${{ runner.os }}-build-
            ${{ runner.os }}-

      - name: Set up .npmrc
        run: |
          echo "@querodelivery:registry=https://npm.pkg.github.com" > .npmrc
          echo "//npm.pkg.github.com/:_authToken=${{ secrets.WF_NPM_TOKEN }}" >> .npmrc
          if [ -n "$FONT_AWESOME_TOKEN" ]; then
            echo "@fortawesome:registry=https://npm.fontawesome.com/" >> .npmrc
            echo "//npm.fontawesome.com/:_authToken=$FONT_AWESOME_TOKEN" >> .npmrc
          fi

      - name: install packages using yarn.lock
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.WF_NPM_TOKEN }}
        run: yarn --frozen-lockfile

      - name: linting
        run: yarn lint

      - name: testing
        env:
          RUN_PUBLISH_COVERAGE: ${{ inputs.WF_PUBLISH_CODE_COVERAGE }}
          BACKSTAGE_URL: ${{ inputs.WF_BACKSTAGE_URL }}
        run: |
          yarn test:ci
          COMPONENT_NAME=$(node -p -e "require('./package.json').name")
          FILE=coverage/int/cobertura-coverage.xml
          if $RUN_PUBLISH_COVERAGE; then
            if [ -f "$FILE" ]; then
              curl --request POST \
                --url "$BACKSTAGE_URL/api/code-coverage/report?entity=component%3Adefault%2F$COMPONENT_NAME&coverageType=cobertura" \
                --header 'Content-Type: text/xml' \
                --data @$FILE
              echo "Sending coverage report to quero developer portal"
            else
              echo "::warning:: $FILE does not exist, code coverage not sent"
            fi
          fi

      # Precisa continuar ANTES do Release: a validacao autoritativa depende da
      # imagem, que so existe depois do semantic-release.
      - name: Validating workers declaration
        id: workers
        run: |
          set -euo pipefail

          if [ ! -d .quero/workers ]; then
            echo "has_workers=false" >> "$GITHUB_OUTPUT"
            echo "workers=[]" >> "$GITHUB_OUTPUT"
            echo "Sem .quero/workers/: nada a validar."
            exit 0
          fi

          shopt -s nullglob
          files=(.quero/workers/*.yaml)

          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::.quero/workers/ existe mas nao declara nenhum worker"
            exit 1
          fi

          field() {
            grep -E "^$2:[[:space:]]*" "$1" | head -1 \
              | sed -E "s/^$2:[[:space:]]*//" | tr -d "\"'" | xargs || true
          }

          names=()
          entrypoints=()
          failed=0

          for file in "${files[@]}"; do
            base="$(basename "$file" .yaml)"
            name="$(field "$file" name)"
            description="$(field "$file" description)"
            owner="$(field "$file" owner)"
            entrypoint="$(field "$file" entrypoint)"

            if [ -z "$name" ] || [ "$name" != "$base" ]; then
              echo "::error file=$file::name deve existir e ser igual ao nome do arquivo ($base), veio \"$name\""
              failed=1
              continue
            fi

            for required in description owner entrypoint; do
              if [ -z "$(field "$file" "$required")" ]; then
                echo "::error file=$file::campo obrigatorio ausente: $required"
                failed=1
              fi
            done

            if [ ! -f "src/workers/$name.worker.ts" ] && [ ! -f "src/workers/$name.worker.js" ]; then
              echo "::error file=$file::worker declarado sem implementacao: src/workers/$name.worker.ts nao existe"
              failed=1
            fi

            names+=("$name")
            entrypoints+=("$entrypoint")
          done

          unique_entrypoints="$(printf '%s\n' "${entrypoints[@]}" | sort -u | wc -l | xargs)"
          if [ "$unique_entrypoints" != "1" ]; then
            echo "::error::workers declaram entrypoints diferentes: $(printf '%s ' "${entrypoints[@]}")"
            failed=1
          fi

          if [ "$failed" != "0" ]; then
            exit 1
          fi

          workers_json="$(printf '%s\n' "${names[@]}" | jq -R . | jq -sc 'sort')"

          echo "has_workers=true" >> "$GITHUB_OUTPUT"
          echo "workers=$workers_json" >> "$GITHUB_OUTPUT"
          echo "entrypoint=${entrypoints[0]}" >> "$GITHUB_OUTPUT"
          echo "Workers declarados: $workers_json"

      - name: Release
        env:
          NPM_TOKEN: ${{ secrets.WF_NPM_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.WF_GITHUB_TOKEN }}
        run: yarn release

      - name: Getting SERVICE_NAME
        id: serviceName
        run: |
          SERVICE_NAME=$(node -p -e "require('./package.json').name")
          echo "servicename=$SERVICE_NAME" >> $GITHUB_OUTPUT

      - name: Creating dotenv from aws parameter store
        uses: almerindo/action-env-from-aws-ssm@main
        if: ${{ inputs.WF_CREATE_DOTENV_BEFORE_BUILD }}
        with:
          output: ./.env
          ssm-path: "/${{ inputs.WF_ENV_TYPE }}/${{ steps.serviceName.outputs.servicename }}"
          format: dotenv
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.WF_AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.WF_AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.WF_AWS_REGION }}

      - name: Build Docker image
        run: |
          docker build -t ${{ steps.serviceName.outputs.servicename }}:ci-build .

      - name: Save Docker image
        run: |
          docker save ${{ steps.serviceName.outputs.servicename }}:ci-build | gzip > image.tar.gz

      - name: Upload Docker image as artifact
        uses: actions/upload-artifact@v4
        with:
          name: built-image
          path: image.tar.gz
          retention-days: 1

  # Pergunta a imagem que vai subir quais workers ela aceita, em vez de inferir
  # do fonte. Mesmo run: o artefato built-image e por run.
  validate-workers:
    name: validating workers against the built image
    needs: setup
    if: needs.setup.outputs.has_workers == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Download built image
        uses: actions/download-artifact@v4
        with:
          name: built-image

      - name: Load built image
        run: docker load --input image.tar.gz

      - name: Compare the image registry with the declaration
        env:
          IMAGE: ${{ needs.setup.outputs.output1 }}:ci-build
          ENTRYPOINT: ${{ needs.setup.outputs.workers_entrypoint }}
          DECLARED: ${{ needs.setup.outputs.workers }}
        run: |
          set -euo pipefail

          # --entrypoint ignora o CMD da imagem; tail -1 ignora o que um agente
          # de instrumentacao escreva em stdout antes do JSON.
          output="$(docker run --rm --entrypoint node "$IMAGE" "$ENTRYPOINT" --list)"
          actual="$(printf '%s' "$output" | tail -1)"

          if ! printf '%s' "$actual" | jq -e 'type == "array"' > /dev/null 2>&1; then
            echo "::error::--list nao retornou um array JSON. Saida completa:"
            printf '%s\n' "$output"
            exit 1
          fi

          expected="$(printf '%s' "$DECLARED" | jq -Sc 'sort')"
          got="$(printf '%s' "$actual" | jq -Sc 'sort')"

          echo "declarado em .quero/workers/: $expected"
          echo "aceito pela imagem:            $got"

          if [ "$expected" != "$got" ]; then
            echo "::error::declaracao e codigo divergem. Um worker declarado sem implementacao sobe pod em CrashLoopBackOff; um worker implementado sem declaracao nao e deployado."
            exit 1
          fi

  # Avisa em PR em vez de bloquear porque defs/main e alvo movel: o PR de um dev
  # nao pode ficar vermelho por mudanca pendente de outra pessoa.
  validate-workers-defs:
    name: validating workers against kube-apps-definitions
    needs: setup
    if: needs.setup.outputs.has_workers == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout definitions repo
        uses: actions/checkout@v4
        with:
          repository: QueroDelivery/kube-apps-definitions
          ref: main
          token: ${{ secrets.WF_GITHUB_TOKEN }}
          path: defs

      - name: Compare the declaration with the deployed command
        env:
          SERVICE: ${{ needs.setup.outputs.output1 }}
          DECLARED: ${{ needs.setup.outputs.workers }}
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "push" ]; then
            LEVEL=error
          else
            LEVEL=warning
          fi

          declared="$(printf '%s' "$DECLARED" | jq -r '.[]')"
          failed=0

          for name in $declared; do
            if [ ! -d "defs/$SERVICE-worker-$name" ]; then
              echo "::$LEVEL::worker \"$name\" declarado sem pasta em kube-apps-definitions ($SERVICE-worker-$name). O deploy dele vai falhar."
              failed=1
            fi
          done

          shopt -s nullglob
          for dir in defs/"$SERVICE"-worker-*; do
            name="$(basename "$dir")"
            name="${name#"$SERVICE"-worker-}"

            if ! printf '%s' "$DECLARED" | jq -e --arg n "$name" 'index($n) != null' > /dev/null; then
              echo "::$LEVEL::kube-apps-definitions tem $(basename "$dir"), mas \"$name\" nao esta declarado em .quero/workers/. Esse pod sobe em CrashLoopBackOff."
              failed=1
            fi
          done

          if [ "$failed" = "0" ]; then
            echo "Declaracao e kube-apps-definitions estao de acordo."
          elif [ "$LEVEL" = "error" ]; then
            exit 1
          fi
