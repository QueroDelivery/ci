name: CI-WORKERS-DEPLOY

# Deploy dos workers declarados em .quero/workers/ do servico.
#
# Um job por worker, derivado da declaracao — adicionar um worker nao adiciona
# uma linha de workflow em serviço nenhum.
#
# Nao chama o ci_push_gitops: o worker roda a MESMA imagem, no MESMO namespace e
# com o MESMO ConfigMap do serviço (via envFromConfigMaps no values do worker).
# Repetir o apply do ConfigMap e o setup de kubectl por worker seria trabalho
# redundante e exigiria as credenciais da AWS aqui. O deploy de um worker e
# exatamente uma coisa: apontar a pasta dele no kube-apps-definitions para a
# imagem nova.
#
# Os recursos do worker (cpu, memoria, probes, replicas) NAO vem daqui: moram no
# kube-apps-definitions, que continua sendo do DevOps.

on:
  workflow_call:
    inputs:
      WF_SERVICE_NAME:
        description: "Service name, as emitted by base_node_build"
        type: string
        required: true
      WF_ENV_TYPE_DEPLOY:
        description: "Environment folder in kube-apps-definitions (staging, production)"
        type: string
        required: true
      WF_IMAGE_TAG:
        description: "Image tag to deploy, the same one used by the API"
        type: string
        required: true
      WF_WORKERS:
        description: "JSON array with the worker names, as emitted by base_node_build"
        type: string
        required: true
    secrets:
      WF_GITHUB_TOKEN:
        required: true

permissions:
  contents: write

jobs:
  deploy:
    name: deploying worker ${{ matrix.worker }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.WF_ENV_TYPE_DEPLOY }}
    strategy:
      # Serial de proposito: os jobs comitam no mesmo repositorio de
      # definitions, e push concorrente vira conflito de rebase.
      max-parallel: 1
      fail-fast: false
      matrix:
        worker: ${{ fromJSON(inputs.WF_WORKERS) }}
    steps:
      - name: Checkout definitions repo
        uses: actions/checkout@v4
        with:
          repository: QueroDelivery/kube-apps-definitions
          ref: main
          token: ${{ secrets.WF_GITHUB_TOKEN }}
          fetch-depth: 0
          path: defs

      - name: Set the worker image tag
        working-directory: defs
        env:
          APP: ${{ inputs.WF_SERVICE_NAME }}-worker-${{ matrix.worker }}
          ENV: ${{ inputs.WF_ENV_TYPE_DEPLOY }}
          IMAGE_TAG: ${{ inputs.WF_IMAGE_TAG }}
        run: |
          set -euo pipefail

          # A pasta e criada pelo DevOps (ou pelo PR que o template do Backstage
          # abre). Ausente, o deploy falha alto em vez de criar uma app
          # incompleta que o ArgoCD tentaria sincronizar.
          if [ ! -d "$APP/$ENV" ]; then
            echo "::error::$APP/$ENV nao existe em kube-apps-definitions. Crie a pasta do worker antes de deployar."
            exit 1
          fi

          FILE="$APP/$ENV/version-values.yaml"

          cat > "$FILE" <<EOF
          image:
            tag: "${IMAGE_TAG}"
          EOF

      - name: Commit & push if changed
        working-directory: defs
        env:
          APP: ${{ inputs.WF_SERVICE_NAME }}-worker-${{ matrix.worker }}
          ENV: ${{ inputs.WF_ENV_TYPE_DEPLOY }}
          IMAGE_TAG: ${{ inputs.WF_IMAGE_TAG }}
        run: |
          set -euo pipefail
          FILE="$APP/$ENV/version-values.yaml"

          git config --global user.name  "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --global --add safe.directory "$PWD"

          git add "$FILE"

          if git diff --cached --quiet -- "$FILE"; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "chore(${APP}): set ${ENV} image.tag=${IMAGE_TAG}"
          git pull --rebase origin main
          git push origin HEAD
