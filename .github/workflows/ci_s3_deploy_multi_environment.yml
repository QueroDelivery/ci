name: Build the application, provision infra (Terraform), upload to S3, and invalidate cache.

on:
  workflow_call:
    inputs:
      environment_type:
        required: true
        type: string
      node_version:
        required: false
        type: number
        default: 22
      has_semantic_release:
        required: false
        type: boolean
        default: true
      create_pr_in_main:
        required: false
        type: boolean
        default: false
      custom_aliases:
        description: "Optional Terraform list of extra CloudFront aliases, for example [\"qdplan.querodelivery.com\"]. Empty uses the module default."
        required: false
        type: string
        default: ""
      custom_certificate_arn:
        description: "Optional ACM certificate ARN in us-east-1. In prod it replaces certificate_arn when set."
        required: false
        type: string
        default: ""
    secrets:
      AWS_ACCESS_KEY_ID:
        required: true
      AWS_SECRET_ACCESS_KEY:
        required: true
      AWS_REGION:
        required: true
      SPA_PROD_CERT_ARN:
        required: true
      SPA_STAGE_CERT_ARN:
        required: true
      SPA_PREVIEW_CERT_ARN:
        required: true
      SPA_TF_STATE_BUCKET:
        required: true
      WF_GITHUB_TOKEN:
        required: false

env:
  APP_PREFIX: ${{ inputs.environment_type == 'preview' && format('preview-pr-{0}', github.event.pull_request.number) || '' }}
  GH_TOKEN_CI: ${{ secrets.WF_GITHUB_TOKEN }}

jobs:
  provision_and_build:
    name: Provision Infra & Deploy to S3
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.environment_type }}
    outputs:
      app_name: ${{ steps.appPrefix.outputs.app_name }}
      app_prefix: ${{ steps.appPrefix.outputs.app_prefix }}
      s3_bucket: ${{ steps.tf_apply.outputs.s3_bucket_name }}
      cloudfront_id: ${{ steps.tf_apply.outputs.cloudfront_distribution_id }}

    steps:
      - name: Validate environment_type input
        run: |
          case "${{ inputs.environment_type }}" in
            stage|prod|preview)
              echo "✅ environment_type is valid: ${{ inputs.environment_type }}"
              ;;
            *)
              echo "❌ Invalid environment_type: ${{ inputs.environment_type }}"
              exit 1
              ;;
          esac

      - name: Checkout Application
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.WF_GITHUB_TOKEN }}

      - name: Checkout Terraform Infra
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/terraform
          ref: v1.2.0
          path: _infra
          token: ${{ secrets.WF_GITHUB_TOKEN }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Resolve Project Name
        id: projectName
        run: |
          APP_NAME=$(node -p "require('./package.json').name.replace(/^@[^/]+\//, '').toLowerCase().replace(/[^a-z0-9-]/g, '-')")
          echo "app_name=$APP_NAME" >> $GITHUB_OUTPUT

      - name: Resolve app prefix
        id: appPrefix
        run: |
          PREFIX="$APP_PREFIX"
          if [ "${{ inputs.environment_type }}" = "preview" ]; then
            PREFIX="${{ steps.projectName.outputs.app_name }}/$APP_PREFIX"
          fi
          echo "app_name=${{ steps.projectName.outputs.app_name }}" >> $GITHUB_OUTPUT
          echo "app_prefix=$PREFIX" >> $GITHUB_OUTPUT

      - name: Terraform Init & Apply
        id: tf_apply
        working-directory: _infra/infra/spa-static-frontend
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          CUSTOM_ALIASES: ${{ inputs.custom_aliases }}
          CUSTOM_CERTIFICATE_ARN: ${{ inputs.custom_certificate_arn }}
        run: |
          if [ "${{ inputs.environment_type }}" = "preview" ]; then
            STATE_KEY="global/preview/terraform.tfstate"
          else
            STATE_KEY="${{ steps.projectName.outputs.app_name }}/${{ inputs.environment_type }}/terraform.tfstate"
          fi

          terraform init -input=false \
            -backend-config="bucket=${{ secrets.SPA_TF_STATE_BUCKET }}" \
            -backend-config="key=$STATE_KEY" \
            -backend-config="region=${{ secrets.AWS_REGION }}" \
            -backend-config="use_lockfile=true"

          if [ "${{ inputs.environment_type }}" = "prod" ]; then
            CERT_ARN="${{ secrets.SPA_PROD_CERT_ARN }}"
          elif [ "${{ inputs.environment_type }}" = "stage" ]; then
            CERT_ARN="${{ secrets.SPA_STAGE_CERT_ARN }}"
          else
            CERT_ARN="${{ secrets.SPA_PREVIEW_CERT_ARN }}"
          fi

          TF_VARS=(
            -var="project_name=${{ steps.projectName.outputs.app_name }}"
            -var="environment_type=${{ inputs.environment_type }}"
            -var="hosted_zone_name=${{ vars.SPA_HOSTED_ZONE_NAME }}"
            -var="preview_domain_name=${{ vars.SPA_PREVIEW_DOMAIN }}"
            -var="preview_bucket_name=${{ vars.SPA_PREVIEW_BUCKET_NAME }}"
            -var="certificate_arn=$CERT_ARN"
          )
          if [ -n "$CUSTOM_ALIASES" ]; then
            TF_VARS+=(-var="custom_aliases=${CUSTOM_ALIASES}")
          fi
          if [ -n "$CUSTOM_CERTIFICATE_ARN" ]; then
            TF_VARS+=(-var="custom_certificate_arn=${CUSTOM_CERTIFICATE_ARN}")
          fi

          terraform apply -auto-approve -input=false "${TF_VARS[@]}"

          echo "s3_bucket_name=$(terraform output -raw s3_bucket_name)" >> $GITHUB_OUTPUT
          echo "cloudfront_distribution_id=$(terraform output -raw cloudfront_distribution_id)" >> $GITHUB_OUTPUT

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node_version }}
          cache: "yarn"

      - name: Install Dependencies
        run: yarn install --frozen-lockfile

      - name: Commit message lint
        uses: wagoid/commitlint-github-action@v6
        with:
          token: ${{ secrets.WF_GITHUB_TOKEN }}

      - name: Typescript check
        run: yarn tsc --build

      - name: Test coverage
        run: yarn test:ci

      - name: Comment coverage report
        if: github.event_name == 'pull_request'
        uses: davelosert/vitest-coverage-report-action@v2
        with:
          github-token: ${{ secrets.WF_GITHUB_TOKEN }}

      - name: Semantic release
        if: ${{ inputs.has_semantic_release == true && inputs.environment_type != 'preview' }}
        env:
          GITHUB_TOKEN: ${{ secrets.WF_GITHUB_TOKEN }}
        run: yarn release

      - name: Create .env file from aws parameter store
        uses: almerindo/action-env-from-aws-ssm@main
        with:
          output: ./.env
          ssm-path: "/${{ inputs.environment_type == 'preview' && 'stage' || inputs.environment_type }}/${{ steps.projectName.outputs.app_name }}"
          format: dotenv
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.AWS_REGION }}

      - name: Build project
        run: yarn build

      - name: Upload to S3
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          TARGET_BUCKET: ${{ steps.appPrefix.outputs.app_prefix != '' && format('s3://{0}/{1}', steps.tf_apply.outputs.s3_bucket_name, steps.appPrefix.outputs.app_prefix) || format('s3://{0}', steps.tf_apply.outputs.s3_bucket_name) }}
        run: |
          aws s3 sync ./build/assets "$TARGET_BUCKET/assets" --cache-control "public, max-age=31536000, immutable"
          aws s3 sync ./build "$TARGET_BUCKET" --exclude "assets/*" --exclude "index.html" --cache-control "public, max-age=86400"
          aws s3 cp ./build/index.html "$TARGET_BUCKET/index.html" --cache-control "no-cache" --metadata-directive REPLACE

      - name: Check if there are commits between stage and main
        id: check_commits
        if: ${{ inputs.create_pr_in_main && inputs.environment_type == 'stage' }}
        run: |
          git fetch origin main stage
          if [ "$(git rev-list --count origin/main..origin/stage)" -eq 0 ]; then
            echo "commits_ahead=false" >> $GITHUB_OUTPUT
          else
            echo "commits_ahead=true" >> $GITHUB_OUTPUT
          fi

      - name: Check if PR already exists
        id: check_pr
        if: ${{ inputs.create_pr_in_main && inputs.environment_type == 'stage' && steps.check_commits.outputs.commits_ahead == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.WF_GITHUB_TOKEN }}
        run: |
          pr_exists=$(gh pr list --base main --head stage --state open --json number --jq '. | length')
          echo "pr_exists=$pr_exists" >> $GITHUB_OUTPUT

      - name: Create Pull Request for prod
        if: ${{ inputs.create_pr_in_main && inputs.environment_type == 'stage' && steps.check_commits.outputs.commits_ahead == 'true' && steps.check_pr.outputs.pr_exists == '0' }}
        env:
          GH_TOKEN: ${{ secrets.WF_GITHUB_TOKEN }}
        run: |
          gh pr create \
            --base main \
            --head stage \
            --title "Deploy in prod" \
            --body "Pull request body"

  publish_application_and_invalidate_cache:
    needs: provision_and_build
    name: Publish application and invalidate cache
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.environment_type }}

    steps:
      - name: Invalidate CloudFront cache
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          CLOUDFRONT_ID: ${{ needs.provision_and_build.outputs.cloudfront_id }}
          PREFIX: ${{ needs.provision_and_build.outputs.app_prefix }}
        run: |
          if [ -n "$PREFIX" ]; then
            INVALIDATION_PATH="/${PREFIX}/*"
          else
            INVALIDATION_PATH="/index.html"
          fi

          aws cloudfront create-invalidation --distribution-id $CLOUDFRONT_ID --paths "$INVALIDATION_PATH"

      - name: Output Release URLs (Stage/Prod)
        if: ${{ inputs.environment_type != 'preview' }}
        run: |
          echo "### 🌐 Release disponível" >> "$GITHUB_STEP_SUMMARY"
          echo "🔗 https://${{ needs.provision_and_build.outputs.app_name }}.${{ inputs.environment_type == 'prod' && vars.SPA_HOSTED_ZONE_NAME || format('stg.{0}', vars.SPA_HOSTED_ZONE_NAME) }}" >> "$GITHUB_STEP_SUMMARY"

      - name: Output Preview URL (Pull Request)
        if: ${{ inputs.environment_type == 'preview' }}
        run: |
          CLEAN_DOMAIN=$(echo "${{ vars.SPA_PREVIEW_DOMAIN }}" | sed 's/*\.//')
          PREVIEW_URL="https://${{ needs.provision_and_build.outputs.app_name }}-pr-${{ github.event.pull_request.number }}.${CLEAN_DOMAIN}"

          echo "### 🚀 Preview disponível" >> "$GITHUB_STEP_SUMMARY"
          echo "🔗 $PREVIEW_URL" >> "$GITHUB_STEP_SUMMARY"
