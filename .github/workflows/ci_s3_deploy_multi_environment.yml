name: Build the application, provision infra (Terraform), upload to S3, and invalidate cache.

on:
  workflow_call:
    inputs:
      environment_type:
        required: true
        type: string
      node_version:
        required: false
        type: number
        default: 22
      has_semantic_release:
        required: false
        type: boolean
        default: true
      create_pr_in_main:
        required: false
        type: boolean
        default: false
      build_node_options:
        description: "Optional NODE_OPTIONS for the build step only, for example --max-old-space-size=2048. Empty keeps the Node.js defaults."
        required: false
        type: string
        default: ""
      custom_aliases:
        description: "Optional Terraform list of extra CloudFront aliases in stage and prod, for example [\"qdplan.querodelivery.com\"]. Empty uses the module default. Ignored in preview."
        required: false
        type: string
        default: ""
    secrets:
      AWS_ACCESS_KEY_ID:
        required: true
      AWS_SECRET_ACCESS_KEY:
        required: true
      AWS_REGION:
        required: true
      SPA_PROD_CERT_ARN:
        required: true
      SPA_STAGE_CERT_ARN:
        required: true
      SPA_PREVIEW_CERT_ARN:
        required: true
      SPA_CUSTOM_CERT_ARN:
        description: "Optional ACM certificate ARN in us-east-1. In stage and prod it replaces certificate_arn when set. Ignored in preview."
        required: false
      SPA_TF_STATE_BUCKET:
        required: true
      WF_GITHUB_TOKEN:
        required: false
      PACKAGE_REGISTRY_ENV:
        description: "Optional private registry variables, one KEY=value per line, exported to the build job for the .npmrc of the application."
        required: false

env:
  APP_PREFIX: ${{ inputs.environment_type == 'preview' && format('preview-pr-{0}', github.event.pull_request.number) || '' }}
  GH_TOKEN_CI: ${{ secrets.WF_GITHUB_TOKEN }}

jobs:
  provision_and_build:
    name: Provision Infra & Deploy to S3
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.environment_type }}
    outputs:
      app_name: ${{ steps.appPrefix.outputs.app_name }}
      app_prefix: ${{ steps.appPrefix.outputs.app_prefix }}
      s3_bucket: ${{ steps.tf_apply.outputs.s3_bucket_name }}
      cloudfront_id: ${{ steps.tf_apply.outputs.cloudfront_distribution_id }}

    steps:
      - name: Validate environment_type input
        run: |
          case "${{ inputs.environment_type }}" in
            stage|prod|preview)
              echo "✅ environment_type is valid: ${{ inputs.environment_type }}"
              ;;
            *)
              echo "❌ Invalid environment_type: ${{ inputs.environment_type }}"
              exit 1
              ;;
          esac

      - name: Checkout Application
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.WF_GITHUB_TOKEN }}
          fetch-depth: ${{ inputs.environment_type == 'preview' && '0' || '1' }}

      - name: Checkout Terraform Infra
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/terraform
          ref: v1.3.0
          path: _infra
          token: ${{ secrets.WF_GITHUB_TOKEN }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Resolve Project Name
        id: projectName
        run: |
          APP_NAME=$(node -p "require('./package.json').name.replace(/^@[^/]+\//, '').toLowerCase().replace(/[^a-z0-9-]/g, '-')")
          echo "app_name=$APP_NAME" >> $GITHUB_OUTPUT

      - name: Resolve app prefix
        id: appPrefix
        run: |
          PREFIX="$APP_PREFIX"
          if [ "${{ inputs.environment_type }}" = "preview" ]; then
            PREFIX="${{ steps.projectName.outputs.app_name }}/$APP_PREFIX"
          fi
          echo "app_name=${{ steps.projectName.outputs.app_name }}" >> $GITHUB_OUTPUT
          echo "app_prefix=$PREFIX" >> $GITHUB_OUTPUT

      - name: Terraform Init & Apply
        id: tf_apply
        working-directory: _infra/infra/spa-static-frontend
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          CUSTOM_ALIASES: ${{ inputs.custom_aliases }}
          CUSTOM_CERTIFICATE_ARN: ${{ secrets.SPA_CUSTOM_CERT_ARN }}
        run: |
          if [ "${{ inputs.environment_type }}" = "preview" ]; then
            STATE_KEY="global/preview/terraform.tfstate"
          else
            STATE_KEY="${{ steps.projectName.outputs.app_name }}/${{ inputs.environment_type }}/terraform.tfstate"
          fi

          terraform init -input=false \
            -backend-config="bucket=${{ secrets.SPA_TF_STATE_BUCKET }}" \
            -backend-config="key=$STATE_KEY" \
            -backend-config="region=${{ secrets.AWS_REGION }}" \
            -backend-config="use_lockfile=true"

          if [ "${{ inputs.environment_type }}" = "prod" ]; then
            CERT_ARN="${{ secrets.SPA_PROD_CERT_ARN }}"
          elif [ "${{ inputs.environment_type }}" = "stage" ]; then
            CERT_ARN="${{ secrets.SPA_STAGE_CERT_ARN }}"
          else
            CERT_ARN="${{ secrets.SPA_PREVIEW_CERT_ARN }}"
          fi

          TF_VARS=(
            -var="project_name=${{ steps.projectName.outputs.app_name }}"
            -var="environment_type=${{ inputs.environment_type }}"
            -var="hosted_zone_name=${{ vars.SPA_HOSTED_ZONE_NAME }}"
            -var="preview_domain_name=${{ vars.SPA_PREVIEW_DOMAIN }}"
            -var="preview_bucket_name=${{ vars.SPA_PREVIEW_BUCKET_NAME }}"
            -var="certificate_arn=$CERT_ARN"
          )
          if [ -n "$CUSTOM_ALIASES" ]; then
            TF_VARS+=(-var="custom_aliases=${CUSTOM_ALIASES}")
          fi
          if [ -n "$CUSTOM_CERTIFICATE_ARN" ]; then
            TF_VARS+=(-var="custom_certificate_arn=${CUSTOM_CERTIFICATE_ARN}")
          fi

          terraform apply -auto-approve -input=false "${TF_VARS[@]}"

          echo "s3_bucket_name=$(terraform output -raw s3_bucket_name)" >> $GITHUB_OUTPUT
          echo "cloudfront_distribution_id=$(terraform output -raw cloudfront_distribution_id)" >> $GITHUB_OUTPUT

      - name: Export package registry variables
        shell: bash
        env:
          PACKAGE_REGISTRY_ENV: ${{ secrets.PACKAGE_REGISTRY_ENV }}
        run: |
          set -euo pipefail

          if [ -z "$PACKAGE_REGISTRY_ENV" ]; then
            echo "Skipped: PACKAGE_REGISTRY_ENV is empty"
            exit 0
          fi

          line_number=0
          while IFS= read -r line || [ -n "$line" ]; do
            line_number=$((line_number + 1))
            line="${line%$'\r'}"
            [ -z "${line//[[:space:]]/}" ] && continue

            if [[ ! "$line" =~ ^([A-Za-z_][A-Za-z0-9_]*)=(.*)$ ]]; then
              echo "::error::PACKAGE_REGISTRY_ENV line ${line_number} is not in the KEY=value format"
              exit 1
            fi

            key="${BASH_REMATCH[1]}"
            value="${BASH_REMATCH[2]}"

            case "$key" in
              VITE_*|REACT_APP_*|NEXT_PUBLIC_*)
                echo "::error::PACKAGE_REGISTRY_ENV line ${line_number} uses ${key}, a prefix that is bundled into the public build. Use the Parameter Store for build variables."
                exit 1
                ;;
            esac

            if [ -n "$value" ]; then
              echo "::add-mask::${value}"
            fi
            echo "${key}=${value}" >> "$GITHUB_ENV"
            echo "Exported ${key}"
          done <<< "$PACKAGE_REGISTRY_ENV"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node_version }}
          cache: "yarn"

      - name: Install Dependencies
        run: yarn install --frozen-lockfile

      - name: Select tests
        id: select_tests
        if: inputs.environment_type == 'preview'
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" != "pull_request" ] || [ -z "$BASE_SHA" ]; then
            echo "Full suite: preview was not started by a pull request"
            echo "mode=all" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git cat-file -e "${BASE_SHA}^{commit}"

          is_full_suite_file() {
            case "$1" in
              package.json|yarn.lock|pnpm-lock.yaml|package-lock.json)
                return 0
                ;;
              vite.config.*|vitest.config.*|vitest.workspace.*|*/vite.config.*|*/vitest.config.*|*/vitest.workspace.*)
                return 0
                ;;
              tsconfig.json|tsconfig.*.json|*/tsconfig.json|*/tsconfig.*.json)
                return 0
                ;;
              setupTests.*|setup-tests.*|vitest.setup.*|*/setupTests.*|*/setup-tests.*|*/vitest.setup.*)
                return 0
                ;;
              test/setup.*|tests/setup.*|*/test/setup.*|*/tests/setup.*)
                return 0
                ;;
              *)
                return 1
                ;;
            esac
          }

          changed=$(git diff --name-only --diff-filter=ACMRD "${BASE_SHA}...HEAD")
          triggers=()
          while IFS= read -r file; do
            [ -z "$file" ] && continue
            if is_full_suite_file "$file"; then
              triggers+=("$file")
            fi
          done <<< "$changed"

          if [ "${#triggers[@]}" -gt 0 ]; then
            echo "Full suite. These files affect every test:"
            printf '  %s\n' "${triggers[@]}"
            echo "mode=all" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          count=0
          if [ -n "$changed" ]; then
            count=$(printf '%s\n' "$changed" | grep -c .)
          fi
          echo "Related tests for ${count} changed file(s) since ${BASE_SHA}"
          echo "mode=changed" >> "$GITHUB_OUTPUT"
          echo "base=${BASE_SHA}" >> "$GITHUB_OUTPUT"

      - name: Commit message lint
        if: inputs.environment_type != 'prod'
        uses: wagoid/commitlint-github-action@v6
        with:
          token: ${{ secrets.WF_GITHUB_TOKEN }}

      - name: Typescript check
        if: inputs.environment_type != 'prod'
        run: yarn tsc --build

      - name: Resolve lint command
        id: lint_command
        if: inputs.environment_type != 'prod'
        shell: bash
        run: |
          LINT_SCRIPT=$(node -p "require('./package.json').scripts?.lint ?? ''")

          if [ -z "$LINT_SCRIPT" ]; then
            echo "Skipped: package.json has no lint script"
            echo "mode=none" >> "$GITHUB_OUTPUT"
          elif [[ "$LINT_SCRIPT" =~ ^eslint[[:space:]] ]] && [[ ! "$LINT_SCRIPT" =~ (\&\&|\|\||;|\|) ]]; then
            echo "Cached ESLint: $LINT_SCRIPT"
            echo "mode=cached" >> "$GITHUB_OUTPUT"
          else
            echo "Uncached: lint script is not a single ESLint command: $LINT_SCRIPT"
            echo "mode=plain" >> "$GITHUB_OUTPUT"
          fi

      - name: Restore ESLint cache
        id: eslint_cache
        if: steps.lint_command.outputs.mode == 'cached'
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/eslint/.eslintcache
          key: eslint-${{ runner.os }}-${{ hashFiles('yarn.lock', '.eslintrc*', 'eslint.config.*', '.eslintignore', 'tsconfig*.json') }}-${{ github.sha }}
          restore-keys: |
            eslint-${{ runner.os }}-${{ hashFiles('yarn.lock', '.eslintrc*', 'eslint.config.*', '.eslintignore', 'tsconfig*.json') }}-

      - name: Lint
        if: steps.lint_command.outputs.mode == 'cached' || steps.lint_command.outputs.mode == 'plain'
        shell: bash
        env:
          LINT_MODE: ${{ steps.lint_command.outputs.mode }}
          ESLINT_CACHE_FILE: ${{ runner.temp }}/eslint/.eslintcache
        run: |
          if [ "$LINT_MODE" = "cached" ]; then
            yarn lint --cache --cache-strategy content --cache-location "$ESLINT_CACHE_FILE"
          else
            yarn lint
          fi

      - name: Save ESLint cache
        if: ${{ !cancelled() && steps.lint_command.outputs.mode == 'cached' && steps.eslint_cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/eslint/.eslintcache
          key: ${{ steps.eslint_cache.outputs.cache-primary-key }}

      - name: Test coverage
        if: inputs.environment_type == 'stage' || (inputs.environment_type == 'preview' && steps.select_tests.outputs.mode == 'all')
        run: yarn test:ci

      - name: Test related changes
        if: inputs.environment_type == 'preview' && steps.select_tests.outputs.mode == 'changed'
        run: yarn test:ci --changed "${{ steps.select_tests.outputs.base }}" --passWithNoTests

      - name: Comment coverage report
        if: github.event_name == 'pull_request' && steps.select_tests.outputs.mode == 'all'
        uses: davelosert/vitest-coverage-report-action@v2
        with:
          github-token: ${{ secrets.WF_GITHUB_TOKEN }}

      - name: Semantic release
        if: ${{ inputs.has_semantic_release == true && inputs.environment_type != 'preview' }}
        env:
          GITHUB_TOKEN: ${{ secrets.WF_GITHUB_TOKEN }}
        run: yarn release

      - name: Create .env file from aws parameter store
        uses: almerindo/action-env-from-aws-ssm@main
        with:
          output: ./.env
          ssm-path: "/${{ inputs.environment_type == 'preview' && 'stage' || inputs.environment_type }}/${{ steps.projectName.outputs.app_name }}"
          format: dotenv
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.AWS_REGION }}

      - name: Build project
        env:
          NODE_OPTIONS: ${{ inputs.build_node_options }}
        run: yarn build

      - name: Upload to S3
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          TARGET_BUCKET: ${{ steps.appPrefix.outputs.app_prefix != '' && format('s3://{0}/{1}', steps.tf_apply.outputs.s3_bucket_name, steps.appPrefix.outputs.app_prefix) || format('s3://{0}', steps.tf_apply.outputs.s3_bucket_name) }}
        run: |
          aws s3 sync ./build/assets "$TARGET_BUCKET/assets" --cache-control "public, max-age=31536000, immutable"
          aws s3 sync ./build "$TARGET_BUCKET" --exclude "assets/*" --exclude "index.html" --cache-control "public, max-age=86400"
          aws s3 cp ./build/index.html "$TARGET_BUCKET/index.html" --cache-control "no-cache" --metadata-directive REPLACE

      - name: Check if there are commits between stage and main
        id: check_commits
        if: ${{ inputs.create_pr_in_main && inputs.environment_type == 'stage' }}
        run: |
          git fetch origin main stage
          if [ "$(git rev-list --count origin/main..origin/stage)" -eq 0 ]; then
            echo "commits_ahead=false" >> $GITHUB_OUTPUT
          else
            echo "commits_ahead=true" >> $GITHUB_OUTPUT
          fi

      - name: Check if PR already exists
        id: check_pr
        if: ${{ inputs.create_pr_in_main && inputs.environment_type == 'stage' && steps.check_commits.outputs.commits_ahead == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.WF_GITHUB_TOKEN }}
        run: |
          pr_exists=$(gh pr list --base main --head stage --state open --json number --jq '. | length')
          echo "pr_exists=$pr_exists" >> $GITHUB_OUTPUT

      - name: Create Pull Request for prod
        if: ${{ inputs.create_pr_in_main && inputs.environment_type == 'stage' && steps.check_commits.outputs.commits_ahead == 'true' && steps.check_pr.outputs.pr_exists == '0' }}
        env:
          GH_TOKEN: ${{ secrets.WF_GITHUB_TOKEN }}
        run: |
          gh pr create \
            --base main \
            --head stage \
            --title "Deploy in prod" \
            --body "Pull request body"

  publish_application_and_invalidate_cache:
    needs: provision_and_build
    name: Publish application and invalidate cache
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.environment_type }}
      url: ${{ steps.deployment_url.outputs.url }}

    steps:
      - name: Resolve deployment URL
        id: deployment_url
        env:
          ENVIRONMENT_TYPE: ${{ inputs.environment_type }}
          APP_NAME: ${{ needs.provision_and_build.outputs.app_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HOSTED_ZONE: ${{ vars.SPA_HOSTED_ZONE_NAME }}
          PREVIEW_DOMAIN: ${{ vars.SPA_PREVIEW_DOMAIN }}
        run: |
          case "$ENVIRONMENT_TYPE" in
            prod) URL="https://${APP_NAME}.${HOSTED_ZONE}" ;;
            stage) URL="https://${APP_NAME}.stg.${HOSTED_ZONE}" ;;
            preview) URL="https://${APP_NAME}-pr-${PR_NUMBER}.${PREVIEW_DOMAIN#\*.}" ;;
          esac
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: Invalidate CloudFront cache
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          CLOUDFRONT_ID: ${{ needs.provision_and_build.outputs.cloudfront_id }}
          PREFIX: ${{ needs.provision_and_build.outputs.app_prefix }}
        run: |
          if [ -n "$PREFIX" ]; then
            INVALIDATION_PATH="/${PREFIX}/*"
          else
            INVALIDATION_PATH="/index.html"
          fi

          aws cloudfront create-invalidation --distribution-id $CLOUDFRONT_ID --paths "$INVALIDATION_PATH"

      - name: Output deployment URL
        env:
          TITLE: ${{ inputs.environment_type == 'preview' && '🚀 Preview disponível' || '🌐 Release disponível' }}
          URL: ${{ steps.deployment_url.outputs.url }}
        run: |
          echo "### $TITLE" >> "$GITHUB_STEP_SUMMARY"
          echo "🔗 $URL" >> "$GITHUB_STEP_SUMMARY"

      - name: Comment preview URL on the pull request
        if: ${{ inputs.environment_type == 'preview' && github.event_name == 'pull_request' }}
        env:
          GH_TOKEN: ${{ secrets.WF_GITHUB_TOKEN || github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          APP_NAME: ${{ needs.provision_and_build.outputs.app_name }}
          PREVIEW_DOMAIN: ${{ vars.SPA_PREVIEW_DOMAIN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          COMMIT_URL: ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          MARKER='<!-- preview-url -->'
          HOST="${APP_NAME}-pr-${PR_NUMBER}.${PREVIEW_DOMAIN#\*.}"
          UPDATED_AT=$(TZ=America/Sao_Paulo date '+%d/%m/%Y %H:%M')

          BODY=$(cat <<MD
          ${MARKER}
          > [!TIP]
          > ### 🚀 Preview pronto
          > **[${HOST}](https://${HOST})**
          >
          > 📦 [\`${HEAD_SHA:0:7}\`](${COMMIT_URL}) · 🌿 \`${HEAD_REF}\` · 🕒 ${UPDATED_AT} (BRT) · [Ver execução](${RUN_URL})

          <sub>🔄 Atualizado a cada push · 🧹 Removido ao fechar a PR</sub>
          MD
          )

          COMMENT_ID=$(gh api "repos/${REPO}/issues/${PR_NUMBER}/comments" --paginate \
            --jq ".[] | select(.body | startswith(\"${MARKER}\")) | .id" | head -n1)

          if [ -n "$COMMENT_ID" ]; then
            gh api -X PATCH "repos/${REPO}/issues/comments/${COMMENT_ID}" -f body="$BODY" > /dev/null
            echo "Updated comment ${COMMENT_ID}"
          else
            gh pr comment "$PR_NUMBER" --repo "$REPO" --body "$BODY"
          fi
