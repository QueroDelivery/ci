name: Remove uploaded preview in S3.

on:
  workflow_call:
    secrets:
      AWS_ACCESS_KEY_ID:
        required: true
      AWS_SECRET_ACCESS_KEY:
        required: true
      AWS_REGION:
        required: true

jobs:
  clear_s3_preview:
    name: Clear S3 build preview and invalidate cache
    runs-on: ubuntu-latest
    environment:
      name: preview

    env:
      PREVIEW_PREFIX: preview-pr-${{ github.event.pull_request.number }}

    steps:
      - name: Checkout Application
        uses: actions/checkout@v4

      - name: Resolve app prefix
        id: appPrefix
        run: |
          APP_NAME=$(node -p "require('./package.json').name.replace(/^@[^/]+\//, '').toLowerCase().replace(/[^a-z0-9-]/g, '-')")
          echo "app_prefix=$APP_NAME/$PREVIEW_PREFIX" >> $GITHUB_OUTPUT

      - name: Fetch Global Preview CloudFront ID
        id: cf_id
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
        run: |
          CF_ID=$(aws cloudfront list-distributions \
            --query "DistributionList.Items[?Aliases.Items!=null] | [?contains(Aliases.Items, '${{ vars.SPA_PREVIEW_DOMAIN }}')].Id | [0]" \
            --output text)
          
          if [ "$CF_ID" == "None" ] || [ -z "$CF_ID" ]; then
            echo "❌ Distribuição CloudFront para o domínio ${{ vars.SPA_PREVIEW_DOMAIN }} não encontrada."
            exit 1
          fi
          
          echo "cloudfront_id=$CF_ID" >> $GITHUB_OUTPUT

      - name: Remove preview folder from S3
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
        run: |
          aws s3 rm "s3://${{ vars.SPA_PREVIEW_BUCKET_NAME }}/${{ steps.appPrefix.outputs.app_prefix }}" --recursive

      - name: Invalidate CloudFront cache
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ steps.cf_id.outputs.cloudfront_id }} \
            --paths "/${{ steps.appPrefix.outputs.app_prefix }}/*"
